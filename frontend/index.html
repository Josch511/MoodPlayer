<!DOCTYPE html>
<html>
<head>
    <title>MoodPlayer</title>
    <link rel="icon" type="image/x-icon" href="img/iconLogo.png">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
</head>
<body>

    <button class="dark-toggle">🌙</button>

    <!-- Logo -->
    <div class="container">
        <div class="logoIndex">
        <img src="img/logoTilMoodPlayer.png"/>
        </div>

        <!-- titel -->
        <h1 class="title">MoodPlayer</h1>
        <p class="subtitle">Din personlige stemningsbaserede musikoplevelse</p>

        <!-- Indtastning af username og password -->
        <form class="login-form" action="categories.html" method="GET">
            <label>Brugernavn</label>
            <input id="username" type="text" placeholder=""/>

            <label for="password">Adgangskode</label>
            <input type="password" id="password" placeholder=""/>
            
        <!-- Indtastning af fødselsdag -->
            <label>Indtast din fødselsdag</label>
            <div class="birthday-wrapper">
                <select id="day">
                    <option value="" disabled selected>Dag</option>
                    <!-- den viser dag 1 - 31 -->
                    <script>
                        for (let d = 1; d <= 31; d++) {
                            document.write(`<option value="${d}">${d}</option>`);
                        }
                    </script>
                </select>

                <!-- Måneder -->
                <select id="month">
                    <option value="" disabled selected>Måned</option>
                    <option>Januar</option>
                    <option>Februar</option>
                    <option>Marts</option>
                    <option>April</option>
                    <option>Maj</option>
                    <option>Juni</option>
                    <option>Juli</option>
                    <option>August</option>
                    <option>September</option>
                    <option>Oktober</option>
                    <option>November</option>
                    <option>December</option>
                </select>

                <!-- År -->
                <select id="year">
                    <option value="" disabled selected>År</option>
                    <!-- gør så du kan vælge år fra 1900 - nuværende år -->
                    <script>
                        const currentYear = new Date().getFullYear();
                        for (let y = currentYear; y >= 1900; y--) {
                            document.write(`<option value="${y}">${y}</option>`);
                        }
                    </script>
                </select>
            </div>

            <!-- Vilkår og betingelser tjekboks -->
            <div class="terms-wrapper">
                <input type="checkbox" id="terms"/>
                <label for="terms">
                    <span class="required">*</span>
                    Ved at fortsætte accepterer du vores vilkår og betingelser
                </label>
            </div>

            <!-- Opret konto knap -->
            <button id="userButton" type="button" class="opret-btn opret-form">Opret konto</button>
        </form>
    </div>

    
    <script src="index.js"></script>
    <script src="darkmode.js"></script>

</body>
</html>
